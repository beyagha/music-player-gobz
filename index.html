<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de Playlist</title>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <div class="container">
        <h1></h1>
        <div id="button-container">
            <img class="button" id="prev" src="/public/button/button-prev.svg" alt="">
            <!-- <button id="prev">⏮ Précédent</button> -->
            <img class="button" id="play" src="/public/button/pause.png" alt="">
            <!-- <button id="play">▶️ Play / Pause</button> -->
            <img class="button" id="next" src="/public/button/button-next.svg" alt="">
            <!-- <button id="next">⏭ Suivant</button> -->
        </div>
        <div class="track-name-container">
            <h2 class="trackPosition" id="track-title">Titre du morceau</h2>
            <h2 class="trackPosition" id="track-name">Titre du morceau</h2>
        </div>
        <ul id="playlist"></ul>
        <ul id="my-music-container"></ul>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
